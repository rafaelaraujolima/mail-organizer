[project]
name = "mail-organizer"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "cryptography>=42.0",
    "google-api-python-client>=2.100",
    "requests>=2.31",
    "imapclient>=3.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
