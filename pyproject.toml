[project]
name = "mail-organizer"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "cryptography>=42.0",
    "google-api-python-client>=2.100",
    "requests>=2.31",
    "imapclient>=3.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "bleach>=6.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]

[tool.pytest.ini_options]
testpaths = ["tests"]
